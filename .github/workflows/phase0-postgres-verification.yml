name: Phase 0 Real PostgreSQL Verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sam_greenfield
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install psycopg2-binary
      - run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          for f in packages/db/migrations/*.sql; do psql $DATABASE_URL -f $f; done
          python tests/phase0/phase0_acceptance.py
          python tests/phase0_postgres/real_postgres_test.py
          python tests/phase0_postgres/test_rls_tenant_isolation.py
          python tests/phase0_postgres/test_rls_fail_closed_security.py
