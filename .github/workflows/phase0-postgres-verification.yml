name: Phase 0 Real PostgreSQL Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sam_greenfield
      DATABASE_URL_APP: postgres://app_tenant_test:test_password@localhost:5432/sam_greenfield
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: sam_greenfield
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres -d sam_greenfield" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SAM dependencies
        run: npm ci
      - name: Install test dependencies
        run: pip install psycopg2-binary
      - name: Apply migrations and run Phase 0 verification
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          python tests/phase0/phase0_acceptance.py
          python tests/phase0_postgres/real_postgres_test.py
          python tests/phase0_postgres/test_rls_tenant_isolation.py
          python tests/phase0_postgres/test_rls_fail_closed_security.py
      - name: Verify autonomous goal submission and planning
        run: |
          node --import tsx --test tests/phase22/bol_analysis.ts
          node --import tsx --test tests/phase22/planner_scope.ts
          node --import tsx tests/phase22/bol_analysis_bridge.ts
          npm run test:phase17:bol-sam
          node --import tsx --test tests/phase22/submit_goal_surface.ts tests/phase21/mcp_internal_oauth.ts
          node --import tsx tests/phase22/submit_goal_planner.ts
          node --import tsx tests/phase22/runtime_recovery.ts
          node --import tsx tests/phase22/acceptance_recovery.ts

  core-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sam_core_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: core-ci-fixture
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres -d sam_core_test" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SAM_CORE_TEST_DATABASE_URL: postgres://postgres:core-ci-fixture@127.0.0.1:5432/sam_core_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run test:core-reliability
      - run: npm run test:core-regression
      - name: Verify TLS fixture toolchain
        run: openssl version
      - name: Isolated protocol and security fixtures
        run: |
          for suite in provider_auth postgres_tls contracts synthetic_pilot; do
            node scripts/testing/core-reliability.cjs --suite tests/release/$suite.ts
          done
          node scripts/testing/core-reliability.cjs --suite tests/release/managed_schema_source.cjs

  clean-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean production-dependency image build
        run: node scripts/development/build-image.cjs sam-core-reliability:ci
