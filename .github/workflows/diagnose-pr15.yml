name: PR 15 Diagnostic (temporary)

on:
  push:
    branches:
      - fix/bol-pagination-analysis-authority

permissions:
  contents: read

jobs:
  runner-smoke:
    name: 1 - GitHub runner smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Verify the runner can execute commands
        run: |
          echo "RUNNER_SMOKE_OK"
          uname -a
          node --version || true

  postgres-and-sam:
    name: 2 - PostgreSQL migrations and SAM acceptance
    runs-on: ubuntu-latest
    needs: runner-smoke
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sam_greenfield
      DATABASE_URL_APP: postgres://app_tenant_test:test_password@localhost:5432/sam_greenfield
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: sam_greenfield
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sam_greenfield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Confirm PostgreSQL readiness
        run: |
          pg_isready -h localhost -p 5432 -U postgres -d sam_greenfield
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version();'

      - name: Apply vector extension and migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run existing PostgreSQL acceptance suites
        run: |
          python -m pip install psycopg2-binary
          python tests/phase0/phase0_acceptance.py
          python tests/phase0_postgres/real_postgres_test.py
          python tests/phase0_postgres/test_rls_tenant_isolation.py
          python tests/phase0_postgres/test_rls_fail_closed_security.py

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run database-backed SAM multi-step acceptance
        run: node --import tsx tests/phase22/submit_goal_planner.ts

      - name: Run SAM MCP and bol analysis tests
        run: node --import tsx --test tests/phase21/mcp_internal_oauth.ts tests/phase22/submit_goal_surface.ts tests/phase23/bol_pagination_analysis.test.ts
