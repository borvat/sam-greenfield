services:
  sam:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_WORKER_ID: ${SAM_WORKER_ID:?SAM_WORKER_ID is required}
      SAM_COMPOSITION_MODULE: /app/apps/runtime/src/productionCompositionModule.ts
      SAM_PRODUCTION_BUNDLE_MODULE: ${SAM_PRODUCTION_BUNDLE_MODULE:?SAM_PRODUCTION_BUNDLE_MODULE is required}
      PORT: 8080
      SAM_TICK_INTERVAL_MS: ${SAM_TICK_INTERVAL_MS:-1000}
      SAM_SHUTDOWN_GRACE_MS: ${SAM_SHUTDOWN_GRACE_MS:-15000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
