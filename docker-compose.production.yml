services:
  sam:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_WORKER_ID: ${SAM_WORKER_ID:?SAM_WORKER_ID is required}
      SAM_COMPOSITION_MODULE: /app/apps/runtime/src/productionCompositionModule.ts
      SAM_PRODUCTION_BUNDLE_MODULE: ${SAM_PRODUCTION_BUNDLE_MODULE:-/app/apps/production/src/defaultBundleModule.ts}
      PORT: 8080
      SAM_TICK_INTERVAL_MS: ${SAM_TICK_INTERVAL_MS:-1000}
      SAM_SHUTDOWN_GRACE_MS: ${SAM_SHUTDOWN_GRACE_MS:-15000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s

  sam-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm","run","start:mcp"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_PRODUCTION_BUNDLE_MODULE: ${SAM_PRODUCTION_BUNDLE_MODULE:-/app/apps/production/src/defaultBundleModule.ts}
      SAM_MCP_PORT: 8081
      SAM_MCP_HOST: 0.0.0.0
      SAM_MCP_ACTOR: ${SAM_MCP_ACTOR:-chatgpt-mcp}
      SAM_MCP_BEARER_TOKEN: ${SAM_MCP_BEARER_TOKEN:?SAM_MCP_BEARER_TOKEN is required}
      SAM_MCP_ALLOWED_HOSTS: ${SAM_MCP_ALLOWED_HOSTS:?SAM_MCP_ALLOWED_HOSTS is required}
      SAM_MCP_ALLOWED_ORIGINS: ${SAM_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8081/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
