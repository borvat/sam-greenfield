x-sam-adapter-env: &sam-adapter-env
  SAM_PRODUCTION_BUNDLE_MODULE: ${SAM_PRODUCTION_BUNDLE_MODULE:-/app/apps/production/src/defaultBundleModule.ts}

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_CAPABILITIES: ${OPENAI_CAPABILITIES:-planning}
  OPENAI_PRIVACY_CLASSES: ${OPENAI_PRIVACY_CLASSES:-PUBLIC,INTERNAL}
  OPENAI_COST_PER_1K_INPUT: ${OPENAI_COST_PER_1K_INPUT:-0}
  OPENAI_COST_PER_1K_OUTPUT: ${OPENAI_COST_PER_1K_OUTPUT:-0}

  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  ANTHROPIC_CAPABILITIES: ${ANTHROPIC_CAPABILITIES:-planning}
  ANTHROPIC_PRIVACY_CLASSES: ${ANTHROPIC_PRIVACY_CLASSES:-PUBLIC,INTERNAL}
  ANTHROPIC_COST_PER_1K_INPUT: ${ANTHROPIC_COST_PER_1K_INPUT:-0}
  ANTHROPIC_COST_PER_1K_OUTPUT: ${ANTHROPIC_COST_PER_1K_OUTPUT:-0}

  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_MODEL: ${GOOGLE_MODEL:-}
  GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/models}
  GOOGLE_CAPABILITIES: ${GOOGLE_CAPABILITIES:-planning}
  GOOGLE_PRIVACY_CLASSES: ${GOOGLE_PRIVACY_CLASSES:-PUBLIC,INTERNAL}
  GOOGLE_COST_PER_1K_INPUT: ${GOOGLE_COST_PER_1K_INPUT:-0}
  GOOGLE_COST_PER_1K_OUTPUT: ${GOOGLE_COST_PER_1K_OUTPUT:-0}

  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_CAPABILITIES: ${DEEPSEEK_CAPABILITIES:-planning}
  DEEPSEEK_PRIVACY_CLASSES: ${DEEPSEEK_PRIVACY_CLASSES:-PUBLIC,INTERNAL}
  DEEPSEEK_COST_PER_1K_INPUT: ${DEEPSEEK_COST_PER_1K_INPUT:-0}
  DEEPSEEK_COST_PER_1K_OUTPUT: ${DEEPSEEK_COST_PER_1K_OUTPUT:-0}

  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_MODEL: ${QWEN_MODEL:-}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-}
  QWEN_CAPABILITIES: ${QWEN_CAPABILITIES:-planning}
  QWEN_PRIVACY_CLASSES: ${QWEN_PRIVACY_CLASSES:-PUBLIC,INTERNAL}
  QWEN_COST_PER_1K_INPUT: ${QWEN_COST_PER_1K_INPUT:-0}
  QWEN_COST_PER_1K_OUTPUT: ${QWEN_COST_PER_1K_OUTPUT:-0}

  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
  GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}
  GMAIL_USER_ID: ${GMAIL_USER_ID:-me}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}
  GMAIL_API_BASE_URL: ${GMAIL_API_BASE_URL:-https://gmail.googleapis.com/gmail/v1}
  GOOGLE_DRIVE_API_BASE_URL: ${GOOGLE_DRIVE_API_BASE_URL:-https://www.googleapis.com/drive/v3}

  EBOEKHOUDEN_API_TOKEN: ${EBOEKHOUDEN_API_TOKEN:-}
  EBOEKHOUDEN_SOURCE: ${EBOEKHOUDEN_SOURCE:-SAM}
  EBOEKHOUDEN_API_BASE_URL: ${EBOEKHOUDEN_API_BASE_URL:-https://api.e-boekhouden.nl}

  BOL_CLIENT_ID: ${BOL_CLIENT_ID:-}
  BOL_CLIENT_SECRET: ${BOL_CLIENT_SECRET:-}
  BOL_TOKEN_URL: ${BOL_TOKEN_URL:-https://login.bol.com/token}
  BOL_RETAILER_BASE_URL: ${BOL_RETAILER_BASE_URL:-https://api.bol.com/retailer}

  SAM_FINANCE_LEGAL_ENTITY_ID: ${SAM_FINANCE_LEGAL_ENTITY_ID:-}
  SAM_FINANCE_LOOP_INTERVAL_MINUTES: ${SAM_FINANCE_LOOP_INTERVAL_MINUTES:-180}
  SAM_FINANCE_LOOKBACK_DAYS: ${SAM_FINANCE_LOOKBACK_DAYS:-30}
  SAM_FINANCE_MATERIAL_VARIANCE_COUNT: ${SAM_FINANCE_MATERIAL_VARIANCE_COUNT:-1}
  SAM_FINANCE_MAX_PAGES: ${SAM_FINANCE_MAX_PAGES:-5}

services:
  sam:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *sam-adapter-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_WORKER_ID: ${SAM_WORKER_ID:?SAM_WORKER_ID is required}
      SAM_COMPOSITION_MODULE: /app/apps/runtime/src/productionCompositionModule.ts
      PORT: 8080
      SAM_TICK_INTERVAL_MS: ${SAM_TICK_INTERVAL_MS:-1000}
      SAM_SHUTDOWN_GRACE_MS: ${SAM_SHUTDOWN_GRACE_MS:-15000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s

  sam-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm","run","start:mcp"]
    environment:
      <<: *sam-adapter-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_MCP_PORT: 8081
      SAM_MCP_HOST: 0.0.0.0
      SAM_MCP_ACTOR: ${SAM_MCP_ACTOR:-chatgpt-mcp}
      SAM_MCP_BEARER_TOKEN: ${SAM_MCP_BEARER_TOKEN:?SAM_MCP_BEARER_TOKEN is required}
      SAM_MCP_ALLOWED_HOSTS: ${SAM_MCP_ALLOWED_HOSTS:?SAM_MCP_ALLOWED_HOSTS is required}
      SAM_MCP_ALLOWED_ORIGINS: ${SAM_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8081/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s


  sam-command-center:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm","run","start:command-center"]
    environment:
      <<: *sam-adapter-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SAM_COMMAND_CENTER_PORT: 8082
      SAM_COMMAND_CENTER_HOST: 0.0.0.0
      SAM_COMMAND_CENTER_BEARER_TOKEN: ${SAM_COMMAND_CENTER_BEARER_TOKEN:?SAM_COMMAND_CENTER_BEARER_TOKEN is required}
      SAM_COMMAND_CENTER_ALLOWED_HOSTS: ${SAM_COMMAND_CENTER_ALLOWED_HOSTS:?SAM_COMMAND_CENTER_ALLOWED_HOSTS is required}
      SAM_COMMAND_CENTER_ALLOWED_ORIGINS: ${SAM_COMMAND_CENTER_ALLOWED_ORIGINS:-}
      SAM_COMMAND_CENTER_LEGAL_ENTITY_ID: ${SAM_COMMAND_CENTER_LEGAL_ENTITY_ID:?SAM_COMMAND_CENTER_LEGAL_ENTITY_ID is required}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8082/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
